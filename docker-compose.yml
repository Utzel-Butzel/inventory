services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - inventory_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://inventory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong database password}@db:5432/inventory
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_SATELLITE_TILE_URL: ${NEXT_PUBLIC_SATELLITE_TILE_URL:-}
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://inventory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong database password}@db:5432/inventory
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to at least 32 random characters}
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL to the public HTTPS URL}
      AUTH_TRUST_HOST: "true"
      SIMPLE_AUTH_EMAIL: ${SIMPLE_AUTH_EMAIL:-admin@inventory.local}
      SIMPLE_AUTH_NAME: ${SIMPLE_AUTH_NAME:-Inventory admin}
      SIMPLE_AUTH_PASSWORD_HASH: ${SIMPLE_AUTH_PASSWORD_HASH:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_PASSWORD_ONCE: ${BOOTSTRAP_ADMIN_PASSWORD_ONCE:-false}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
      NATIVE_TOKEN_TTL_DAYS: ${NATIVE_TOKEN_TTL_DAYS:-30}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL:-}
      AUTH0_DEFAULT_ROLE: ${AUTH0_DEFAULT_ROLE:-editor}
      AUTH0_ROLE_CLAIM: ${AUTH0_ROLE_CLAIM:-}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-true}
      NOTIFICATION_WORKER_POLL_MS: ${NOTIFICATION_WORKER_POLL_MS:-900000}
      NOTIFICATION_CRON_SECRET: ${NOTIFICATION_CRON_SECRET:-}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:admin@example.com}
      NOTIFICATION_SLACK_WEBHOOK_URL: ${NOTIFICATION_SLACK_WEBHOOK_URL:-}
      NOTIFICATION_TEAMS_WEBHOOK_URL: ${NOTIFICATION_TEAMS_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_SIGNING_SECRET: ${NOTIFICATION_WEBHOOK_SIGNING_SECRET:-}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      WEBHOOK_WORKER_ENABLED: ${WEBHOOK_WORKER_ENABLED:-true}
      WEBHOOK_WORKER_POLL_MS: ${WEBHOOK_WORKER_POLL_MS:-2000}
      WEBHOOK_WORKER_CONCURRENCY: ${WEBHOOK_WORKER_CONCURRENCY:-4}
      WEBHOOK_DELIVERY_TIMEOUT_MS: ${WEBHOOK_DELIVERY_TIMEOUT_MS:-10000}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
      WEBHOOK_RETENTION_DAYS: ${WEBHOOK_RETENTION_DAYS:-30}
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
      WEBHOOK_CRON_SECRET: ${WEBHOOK_CRON_SECRET:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /app/data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_USDZ_UPLOAD_MB: ${MAX_USDZ_UPLOAD_MB:-100}
      MAX_ROOM_SCAN_UPLOAD_MB: ${MAX_ROOM_SCAN_UPLOAD_MB:-100}
      OPENINARY_BASE_URL: ${OPENINARY_BASE_URL:-}
      OPENINARY_API_KEY: ${OPENINARY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-5.6-terra}
      OPENAI_TRANSLATION_TIMEOUT_MS: ${OPENAI_TRANSLATION_TIMEOUT_MS:-120000}
      TRANSLATION_WORKER_ENABLED: ${TRANSLATION_WORKER_ENABLED:-true}
      TRANSLATION_WORKER_POLL_MS: ${TRANSLATION_WORKER_POLL_MS:-2000}
      TRANSLATION_WORKER_CONCURRENCY: ${TRANSLATION_WORKER_CONCURRENCY:-1}
      TRANSLATION_JOB_LEASE_SECONDS: ${TRANSLATION_JOB_LEASE_SECONDS:-180}
      TRANSLATION_JOB_MAX_ATTEMPTS: ${TRANSLATION_JOB_MAX_ATTEMPTS:-5}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_COUNT_DEFAULT_MODEL: ${REPLICATE_COUNT_DEFAULT_MODEL:-grounding-dino}
      REPLICATE_GROUNDING_DINO_MODEL: ${REPLICATE_GROUNDING_DINO_MODEL:-}
      REPLICATE_YOLO_WORLD_MODEL: ${REPLICATE_YOLO_WORLD_MODEL:-}
      REPLICATE_SAM2_MODEL: ${REPLICATE_SAM2_MODEL:-}
      REPLICATE_COUNT_MODEL: ${REPLICATE_COUNT_MODEL:-}
      REPLICATE_COUNT_DEADLINE_SECONDS: ${REPLICATE_COUNT_DEADLINE_SECONDS:-300}
      REPLICATE_COUNT_JOB_SECRET: ${REPLICATE_COUNT_JOB_SECRET:-}
      REPLICATE_COUNT_CONFIDENCE: ${REPLICATE_COUNT_CONFIDENCE:-0.5}
      REPLICATE_COUNT_MAX_MASKS: ${REPLICATE_COUNT_MAX_MASKS:-100}
      AI_OUTPUT_LANGUAGE: ${AI_OUTPUT_LANGUAGE:-English}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      AI_ANALYSIS_RATE_LIMIT_PER_MINUTE: ${AI_ANALYSIS_RATE_LIMIT_PER_MINUTE:-}
      AI_RECOGNITION_RATE_LIMIT_PER_MINUTE: ${AI_RECOGNITION_RATE_LIMIT_PER_MINUTE:-}
      AI_RECOGNITION_MAX_CATALOG_ITEMS: ${AI_RECOGNITION_MAX_CATALOG_ITEMS:-2000}
      OPENAI_RECOGNITION_TIMEOUT_MS: ${OPENAI_RECOGNITION_TIMEOUT_MS:-35000}
      AI_COUNT_RATE_LIMIT_PER_MINUTE: ${AI_COUNT_RATE_LIMIT_PER_MINUTE:-}
      AI_TRANSLATION_RATE_LIMIT_PER_MINUTE: ${AI_TRANSLATION_RATE_LIMIT_PER_MINUTE:-30}
      IMAGE_EDIT_PROVIDER: ${IMAGE_EDIT_PROVIDER:-openai}
      OPENAI_IMAGE_EDIT_MODEL: ${OPENAI_IMAGE_EDIT_MODEL:-gpt-image-1}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_IMAGE_EDIT_MODEL: ${GOOGLE_IMAGE_EDIT_MODEL:-gemini-2.5-flash-image}
      IMAGE_EDIT_MODELS: ${IMAGE_EDIT_MODELS:-}
      IMAGE_EDIT_DEFAULT_MODEL: ${IMAGE_EDIT_DEFAULT_MODEL:-}
      AI_IMAGE_RATE_LIMIT_PER_HOUR: ${AI_IMAGE_RATE_LIMIT_PER_HOUR:-12}
    volumes:
      - inventory_uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  inventory_postgres:
  inventory_uploads:
