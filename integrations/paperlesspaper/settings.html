<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Open Inventory settings</title>
    <link rel="stylesheet" href="/assets/paperless.css" />
    <script src="/assets/paperless.iife.js"></script>
    <style>
      html, body { height: auto; overflow: auto; }
      main { max-width: 760px; padding: 20px; margin: auto; }
      h1 { font-size: 24px; margin: 0 0 12px; }
      p { font-size: 14px; line-height: 1.5; }
      form { display: grid; gap: 16px; }
      label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; min-width: 0; }
      input, select, button { box-sizing: border-box; padding: 10px; border: 1px solid var(--pp-border); border-radius: 6px; background: var(--pp-bg); color: var(--pp-fg); width: 100%; min-width: 0; }
      button { cursor: pointer; font-weight: 700; }
      button:disabled { opacity: .6; cursor: wait; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .check { display: flex; align-items: center; }
      .check input { width: auto; }
      #status { min-height: 2em; overflow-wrap: anywhere; }
      @media (max-width: 480px) { .pair { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Open Inventory</h1>
      <p data-label="intro"></p>
      <form id="settings" autocomplete="off">
        <label><span data-label="baseUrl"></span><input id="baseUrl" type="url" placeholder="https://inventory.example.com" maxlength="2048" /></label>
        <label><span data-label="apiKey"></span><input id="apiKey" type="password" placeholder="inv_…" maxlength="4096" autocomplete="new-password" /></label>
        <button id="connect" type="button" data-label="connect"></button>
        <label><span data-label="resourceId"></span><select id="resourceId"></select></label>
        <div class="pair">
          <label><span data-label="view"></span><select id="view"><option value="stock" data-label="stock"></option><option value="low-stock" data-label="lowStock"></option></select></label>
          <label><span data-label="maxItems"></span><input id="maxItems" type="number" min="1" max="50" step="1" /></label>
        </div>
        <label><span data-label="search"></span><input id="search" maxlength="120" /></label>
        <label><span data-label="title"></span><input id="title" maxlength="80" /></label>
        <label><span data-label="timeZone"></span><input id="timeZone" maxlength="100" /></label>
        <label class="check"><input id="sampleData" type="checkbox" /><span data-label="sampleData"></span></label>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./assets/settings.js"></script>
  </body>
</html>
