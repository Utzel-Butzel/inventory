        predictedStockoutAt: { type: [string, "null"], format: date-time }
        isBelowMinimum: { type: boolean }
        suggestedReorderQuantity: { type: integer, minimum: 0 }
    StockMovementInput:
      type: object
      required: [delta, type]
      properties:
        delta: { type: integer, minimum: -1000000, maximum: 1000000, description: Positive receipts and negative issues; zero is reserved for auditable metadata-only unit changes. }
        type: { type: string, enum: [receipt, issue, adjustment, return, waste, transfer] }
        reason: { type: [string, "null"], maxLength: 240 }
        note: { type: string, maxLength: 20000 }
        location: { type: [string, "null"], maxLength: 240 }
        occurredAt: { type: string, format: date-time }
    StockMovement:
      type: object
      required: [id, resourceId, delta, balanceAfter, type, note, occurredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        unitId: { type: [string, "null"], format: uuid }
        assemblyBuildId: { type: [string, "null"], format: uuid }
        purchaseReceiptId: { type: [string, "null"], format: uuid }
        delta: { type: integer }
        balanceAfter: { type: integer, minimum: 0 }
        type:
          type: string
          description: Includes client booking types plus system audit types such as opening_balance, serialization-opening, unit-created, unit-status, unit-update, and merge.
        reason: { type: [string, "null"] }
        note: { type: string }
        location: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        createdBy: { type: [string, "null"] }
    StockUnitInput:
      type: object
      properties:
        count: { type: integer, minimum: 1, maximum: 100, default: 1 }
        code: { type: string, maxLength: 180 }
        codes: { type: array, maxItems: 100, items: { type: string, maxLength: 180 } }
        location: { type: [string, "null"], maxLength: 240 }
        metadata: { type: object, additionalProperties: true }
        acquiredAt: { type: string, format: date-time }
    StockUnitPatch:
      type: object
      properties:
        status: { type: string, enum: [available, reserved, in-use, maintenance, consumed, lost, retired] }
        location: { type: [string, "null"], maxLength: 240 }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
        reason: { type: [string, "null"], maxLength: 240 }
        note: { type: string, maxLength: 20000 }
    StockUnit:
      allOf:
        - { $ref: "#/components/schemas/StockUnitPatch" }
        - type: object
          required: [id, resourceId, code, status, metadata, acquiredAt, lastMovedAt, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            resourceId: { type: string, format: uuid }
            code: { type: string }
            acquiredAt: { type: string, format: date-time }
            lastMovedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    StockOverviewItem:
