        location: { type: [string, "null"], maxLength: 240 }
        note: { type: string, maxLength: 20000 }
        unitCodes:
          type: array
          items: { type: string, maxLength: 180 }
    NativeLoginResponse:
      type: object
      required: [token, user, scopes, expiresAt]
