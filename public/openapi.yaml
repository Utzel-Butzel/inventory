            resourceSku: { type: [string, "null"] }
            receivedQuantity: { type: integer, minimum: 0 }
            openQuantity: { type: integer, minimum: 0 }
            trackingMode: { type: string, enum: [bulk, serialized] }
    PurchaseOrder:
      type: object
