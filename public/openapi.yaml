        serialNumber: { type: [string, "null"] }
        valueCents: { type: [integer, "null"], minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        priority: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string } }
        categories:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
