<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5147d9" />
    <title>Offline · Open Inventory</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f6f7f9; color: #17191c; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e4e7eb; border-radius: 20px; background: #fff; box-shadow: 0 18px 48px rgb(18 24 40 / 0.08); }
      img { width: 52px; height: 52px; }
      h1 { margin: 24px 0 8px; font-size: 24px; letter-spacing: -0.025em; }
      p { margin: 0; color: #5f6672; font-size: 15px; line-height: 1.6; }
      a { display: inline-flex; min-height: 42px; align-items: center; margin-top: 24px; padding: 0 18px; border-radius: 12px; background: #5147d9; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0c10; color: #f3f4f6; }
        main { border-color: #242b34; background: #0c0e12; box-shadow: none; }
        p { color: #aab2be; }
        a { background: #675ee5; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You’re offline</h1>
      <p>This screen has not been saved on this device yet. Reconnect to load it; previously visited screens remain available when Offline mode is enabled.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
