map "$request_method:$uri" $demo_request_allowed {
    default 0;
    ~^(GET|HEAD): 1;
    "POST:/api/auth/callback/demo" 1;
    "POST:/api/auth/signout" 1;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 8k;
    if ($demo_request_allowed = 0) { return 403; }
    if ($http_next_action != "") { return 403; }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Prevent browser-side requests to paid map tiles or external integrations.
    add_header Content-Security-Policy "connect-src 'self'; form-action 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'" always;

    location = / { return 302 /login?demo=1; }
    # Block these surfaces for every HTTP method, including GET workers.
    location ~* ^/api/(v1/ai(?:/|$)|cron(?:/|$)|mcp(?:/|$)|webhooks(?:/|$)) {
        return 403;
    }
    location / {
        proxy_pass http://inventory:3000;
        proxy_http_version 1.1;
        proxy_set_header Host demo.openinventory.polyxo.de;
        proxy_set_header X-Forwarded-Host demo.openinventory.polyxo.de;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
